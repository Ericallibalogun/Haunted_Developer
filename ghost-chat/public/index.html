<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👻 Ghost Chat - Talk to the Spirits</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 🎃 The Haunted Chat Interface -->
    <div class="haunted-container">
        <header class="ghost-header">
            <h1>👻 Ghost Chat</h1>
            <p class="tagline">Speak with the spirits...</p>
        </header>

        <!-- 💀 Chat messages appear here -->
        <div class="chat-window" id="chatWindow">
            <!-- Messages will manifest here -->
        </div>

        <!-- 🕯️ Typing indicator -->
        <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <span>👻 Ghost is typing...</span>
        </div>

        <!-- 🦇 Input area -->
        <div class="input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Type your message to the spirits..."
                autocomplete="off"
            />
            <button id="sendButton">Send 🕯️</button>
        </div>
    </div>

    <script type="module" src="../src/index.js"></script>
</body>
</html>
